# Example local kio configuration.
# Copy to .kio/config.toml for repo-local development or ~/.kio/config.toml
# for your Mac-wide worker config.

bot_login = "kiodreambau"
# kiocheck is the review-system name shown in reports. It is not a comment trigger.
trigger_handle = "kiocheck"
backend = "gito"
workspace = "~/kio"
poll_interval_seconds = 60
default_agents = 2
max_agents = 5
allow_thermonuclear = false
repos = ["kiodreambau/sandbox"]
dashboard_host = "127.0.0.1"
dashboard_port = 8765
launch_agent_label = "io.kio.worker"
launch_agent_runner = "uv"
# webhook_secret = "replace-with-a-long-random-secret"
webhook_dry_run = false
rules_files = ["AGENTS.md", ".kio/review-policy.md"]
token_budget = 250000
# cost_budget_usd = 10.0

# A developer applies one kio label before requesting @kiodreambau as reviewer.
# No PR or issue comment can trigger KIO.
[review_level_labels]
"kio:1" = "level-1"
"kio:2" = "level-2"
"kio:3" = "level-3"
"kio:4" = "level-4"

# `thermonuclear` remains a separately gated local manual mode and is not part of Level 4.
[review_levels]
"1" = ["basic"]
"2" = ["basic", "test-density"]
"3" = ["basic", "test-density", "stability"]
"4" = ["correctness", "test-density", "stability", "performance"]

# Override a built-in template or add project-specific profiles here. Template text,
# the checked-out project rules, and the diff are supplied to every selected pass.
[review_templates]
# stability = "Use our project retry and data-migration rules. Report only concrete regressions."
# accessibility = "For UI changes, check keyboard flow, labels, focus order, and contrast."

# Outbound notification templates. These paths are versioned in this repository.
notification_email_template_file = ".kio/notification-email.md"
codex_handoff_template_file = ".kio/codex-handoff.md"

# Configure email delivery with non-secret routing values here or in the runtime environment.
# KIO ignores SMTP usernames, SMTP passwords, and Slack URLs in TOML. They are runtime-only.
# notification_email_to = ["review@dreambau.com"]
# notification_email_from = "kiocheck@dreambau.com"
# smtp_host = "mail.dreambau.com"
# smtp_port = 587
# smtp_security = "starttls" # starttls, ssl, or none
# KIO_SMTP_USERNAME and KIO_SMTP_PASSWORD are read from the environment.
# KIO_SLACK_WEBHOOK_URL is optional and sends an outbound completion notification only.
# Slack bug intake uses a non-secret channel id here and the signing secret only
# from the runtime environment variable KIO_SLACK_SIGNING_SECRET.
# slack_bug_channel = "C0123456789"
# slack_bot_user_id = "U0123456789"
# slack_bug_repo = "OpenResilienceInitiative/ORISO-Status"
# KIO_SLACK_BOT_TOKEN is read from the runtime environment.

# Optional bounded bug-repair worker. The shared random machine credential is
# never stored in TOML. On macOS save it as the generic Keychain item
# `com.dreambau.kio.repair-worker`; on Linux expose it only through the protected
# service environment variable KIO_REPAIR_WORKER_TOKEN. A headless Mac may use
# the mode-0600 file ~/.config/kio/repair-worker.token when Keychain bootstrap
# cannot be approved interactively.
# repair_api_url = "https://kio.dreambau.com"
# repair_worker_id = "kio-mac-mini"
# repair_command = "codex"
# [repair_repos]
# "OpenResilienceInitiative/ORISO-Status" = "/Users/kio/Projects/ORISO-Status"

# Leave this empty to run the checked-out source as: python -m gito review ...
gito_command = ""

[backend_commands]
# Non-gito backends run a local shell command in the checked-out PR worktree.
# Available placeholders:
# {repo}, {pr}, {mode}, {mode_prompt}, {run_dir}, {checkout_dir}, {diff_file},
# {base_ref}, {head_ref}, {head_sha}, {rules_file}, {default_agents},
# {max_agents}, {token_budget}, {cost_budget_usd}, {review_level}, {profile},
# {profile_title}, {profile_instructions}, {profile_file}, {output_file}
#
# codex = "your-codex-command > {output_file}"
# claude-code = "your-claude-command > {output_file}"
# opencode = "your-opencode-command > {output_file}"
# local = "your-local-model-command > {output_file}"
